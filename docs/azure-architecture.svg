<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title description">
  <title id="title">Azure architecture for the Architecture Review Agent</title>
  <desc id="description">A workshop runtime uses managed identity to access a privately networked Microsoft Foundry project. Foundry Agent Service orchestrates standards, ADR author, and reviewer agents backed by a model deployment. Microsoft Graph connects the runtime to SharePoint for inputs and optional ADR publishing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172b4d" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; letter-spacing: 0; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52606d; }
      .boundary-label { font-size: 17px; font-weight: 700; fill: #005a9e; }
      .service { font-size: 16px; font-weight: 700; }
      .detail { font-size: 13px; fill: #52606d; }
      .agent { font-size: 14px; font-weight: 600; }
      .flow-label { font-size: 12px; font-weight: 600; fill: #52606d; }
      .card { fill: #ffffff; stroke: #c9d2dc; stroke-width: 1.5; rx: 6; filter: url(#shadow); }
      .line { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #0078d4; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-dashed { fill: none; stroke: #52606d; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#f7f9fc"/>
  <path d="M0 0H1400V94H0Z" fill="#ffffff"/>
  <path d="M0 92H1400" stroke="#0078d4" stroke-width="4"/>
  <text x="48" y="45" class="title">Architecture Review Agent</text>
  <text x="48" y="72" class="subtitle">Microsoft Foundry agent orchestration with private Azure networking and SharePoint document exchange</text>

  <!-- External systems -->
  <text x="48" y="135" class="boundary-label" fill="#52606d">WORKSHOP AND M365</text>
  <rect x="48" y="160" width="250" height="138" class="card"/>
  <image href="azure-icons/virtual-machine.png" x="70" y="184" width="54" height="54"/>
  <text x="142" y="202" class="service">Workshop runtime</text>
  <text x="142" y="226" class="detail">Codespace or optional</text>
  <text x="142" y="245" class="detail">private jump box</text>
  <rect x="70" y="261" width="206" height="22" rx="11" fill="#eef6fc"/>
  <image href="azure-icons/managed-identity.png" x="79" y="264" width="16" height="16"/>
  <text x="102" y="277" class="flow-label">DefaultAzureCredential</text>

  <rect x="48" y="522" width="250" height="178" class="card"/>
  <rect x="70" y="548" width="52" height="52" rx="4" fill="#038387"/>
  <text x="96" y="583" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">S</text>
  <text x="142" y="568" class="service">SharePoint</text>
  <text x="142" y="591" class="detail">Standards and submissions</text>
  <path d="M70 622H276" stroke="#d8dee6"/>
  <text x="70" y="649" class="detail">Optional destination for the</text>
  <text x="70" y="669" class="detail">reviewed ADR document</text>

  <rect x="70" y="742" width="206" height="54" rx="6" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
  <text x="173" y="764" text-anchor="middle" class="service">Microsoft Graph</text>
  <text x="173" y="784" text-anchor="middle" class="detail">site-scoped access</text>

  <!-- Azure boundary -->
  <rect x="350" y="124" width="1002" height="676" rx="10" fill="#eef6fc" stroke="#0078d4" stroke-width="2.5"/>
  <rect x="350" y="124" width="1002" height="42" rx="9" fill="#0078d4"/>
  <path d="M350 156H1352V166H350Z" fill="#0078d4"/>
  <text x="372" y="151" font-size="18" font-weight="700" fill="#ffffff">Azure resource group</text>

  <!-- Identity -->
  <rect x="384" y="192" width="274" height="92" class="card"/>
  <image href="azure-icons/managed-identity.png" x="405" y="211" width="48" height="48"/>
  <text x="473" y="225" class="service">Managed identities</text>
  <text x="473" y="248" class="detail">Runtime and Foundry project</text>
  <text x="473" y="267" class="detail">RBAC without stored keys</text>

  <!-- Network -->
  <rect x="384" y="314" width="302" height="442" rx="8" fill="#ffffff" stroke="#59b4d9" stroke-width="2" stroke-dasharray="8 6"/>
  <image href="azure-icons/virtual-network.png" x="405" y="334" width="42" height="42"/>
  <text x="462" y="350" class="service">Virtual network</text>
  <text x="462" y="371" class="detail">Private access path</text>

  <rect x="414" y="406" width="242" height="98" rx="6" fill="#eef8fb" stroke="#59b4d9"/>
  <image href="azure-icons/private-endpoint.png" x="436" y="428" width="48" height="48"/>
  <text x="504" y="442" class="service">Private endpoint</text>
  <text x="504" y="465" class="detail">Foundry account endpoint</text>
  <text x="504" y="484" class="detail">Public access disabled</text>

  <rect x="414" y="548" width="242" height="100" rx="6" fill="#f7f9fc" stroke="#a7b2bf"/>
  <text x="535" y="572" text-anchor="middle" class="service">Private DNS zones</text>
  <text x="535" y="596" text-anchor="middle" class="detail">Cognitive Services</text>
  <text x="535" y="616" text-anchor="middle" class="detail">Foundry services and OpenAI</text>
  <text x="535" y="694" text-anchor="middle" class="detail">Optional Azure Bastion and</text>
  <text x="535" y="714" text-anchor="middle" class="detail">Linux jump box</text>

  <!-- Foundry -->
  <rect x="724" y="192" width="592" height="564" rx="8" fill="#ffffff" stroke="#5c5bd6" stroke-width="2"/>
  <image href="azure-icons/microsoft-foundry.png" x="748" y="216" width="58" height="58"/>
  <text x="824" y="235" class="service" font-size="19">Microsoft Foundry account</text>
  <text x="824" y="259" class="detail">System-assigned identity and private connectivity</text>

  <rect x="748" y="302" width="544" height="405" rx="7" fill="#f5f5ff" stroke="#8b89e6"/>
  <image href="azure-icons/foundry-project.png" x="770" y="321" width="44" height="44"/>
  <text x="829" y="338" class="service">Architecture Review project</text>
  <text x="829" y="360" class="detail">Agents exchange typed JSON contracts</text>

  <rect x="772" y="390" width="328" height="238" rx="6" fill="#ffffff" stroke="#c9d2dc"/>
  <image href="azure-icons/foundry-agent-service.png" x="793" y="411" width="44" height="44"/>
  <text x="852" y="428" class="service">Foundry Agent Service</text>
  <text x="852" y="450" class="detail">Explicit Python orchestrator</text>

  <rect x="796" y="481" width="280" height="34" rx="4" fill="#e8e7ff"/>
  <text x="936" y="503" text-anchor="middle" class="agent">1  Standards agent</text>
  <path d="M936 516V529" class="line-blue"/>
  <rect x="796" y="534" width="280" height="34" rx="4" fill="#e8e7ff"/>
  <text x="936" y="556" text-anchor="middle" class="agent">2  ADR author agent</text>
  <path d="M936 569V582" class="line-blue"/>
  <rect x="796" y="587" width="280" height="34" rx="4" fill="#e8e7ff"/>
  <text x="936" y="609" text-anchor="middle" class="agent">3  Reviewer agent</text>

  <rect x="1130" y="390" width="138" height="238" rx="6" fill="#ffffff" stroke="#c9d2dc"/>
  <image href="azure-icons/foundry-models.png" x="1173" y="418" width="52" height="52"/>
  <text x="1199" y="497" text-anchor="middle" class="service">Model</text>
  <text x="1199" y="518" text-anchor="middle" class="service">deployment</text>
  <text x="1199" y="550" text-anchor="middle" class="detail">Shared by all</text>
  <text x="1199" y="569" text-anchor="middle" class="detail">three agents</text>
  <path d="M1100 509H1122" class="line-blue"/>

  <rect x="772" y="652" width="496" height="34" rx="4" fill="#ffffff" stroke="#c9d2dc"/>
  <text x="1020" y="674" text-anchor="middle" class="agent">Reviewed ADR JSON returned to the workshop runtime</text>

  <!-- Flows -->
  <path d="M298 222H336Q365 222 384 238" class="line-blue"/>
  <text x="315" y="207" class="flow-label">RBAC</text>
  <path d="M298 258H322Q350 258 350 286V437Q350 455 406 455" class="line-blue"/>
  <text x="315" y="329" class="flow-label">private API calls</text>
  <path d="M656 455H704Q724 455 724 435" class="line-blue"/>
  <path d="M535 504V540" class="line-dashed"/>
  <path d="M173 700V734" class="line"/>
  <path d="M276 769H318Q332 769 332 755V635Q332 610 298 610" class="line"/>
  <text x="305" y="733" class="flow-label">read inputs</text>
  <path d="M772 669H700Q680 669 680 728V769H285" class="line-dashed"/>
  <text x="442" y="754" class="flow-label">optional DOCX upload</text>

  <rect x="1036" y="721" width="232" height="22" rx="11" fill="#e8e7ff"/>
  <text x="1152" y="736" text-anchor="middle" class="flow-label">Standards remain authoritative</text>

  <text x="48" y="835" class="detail">Solid lines show required runtime paths. Dashed lines show optional publishing or supporting infrastructure.</text>
</svg>